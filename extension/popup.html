<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>上下文观察器</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 300px;
        font: 13px/20px ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        background: #14161a;
        color: #d7dae0;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f7f5;
          color: #24272c;
        }
        button {
          background: #ffffff;
          color: #24272c;
          border-color: #d4d6da;
        }
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #origin {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        word-break: break-all;
        margin-bottom: 8px;
      }
      #hint,
      #status {
        color: #8a8f99;
        margin: 8px 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      button {
        font: inherit;
        width: 100%;
        height: 28px;
        background: #1d2026;
        color: #d7dae0;
        border: 1px solid #33373f;
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.15);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>上下文观察器</h1>
    <div id="origin"></div>
    <div id="hint"></div>
    <button id="attach" type="button">在此页面启用观察器</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
